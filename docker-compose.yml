services:
  n8n:
    image: n8nio/n8n:latest
    container_name: clinic_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - TZ=${TIMEZONE:-America/Sao_Paulo}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - clinic-network

  evolution-api:
    image: atendai/evolution-api:v2.2.2
    container_name: clinic_evolution_api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=${DATABASE_ENABLED:-false}
      - DATABASE_CONNECTION_URI=${DATABASE_CONNECTION_URI:-}
      - DATABASE_CONNECTION_CLIENT_NAME=${DATABASE_CONNECTION_CLIENT_NAME:-evolution_exchange}
      - STORE_MESSAGES=${STORE_MESSAGES:-true}
      - STORE_MESSAGE_UP=${STORE_MESSAGE_UP:-true}
      - STORE_CONTACTS=${STORE_CONTACTS:-true}
      - STORE_CHATS=${STORE_CHATS:-true}
      - WEBHOOK_GLOBAL_ENABLED=${WEBHOOK_GLOBAL_ENABLED:-false}
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_GLOBAL_URL:-http://n8n:5678/webhook/evolution}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - CONFIG_SESSION_PHONE_CLIENT=ClinicWhatsAppAgent
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - clinic-network

volumes:
  n8n_data:
    name: clinic_n8n_data
  evolution_instances:
    name: clinic_evolution_instances

networks:
  clinic-network:
    name: clinic_network
    driver: bridge
